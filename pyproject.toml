[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "metis-research"
version = "0.1.0"
description = "Metis: an independent, extensible AI research platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["httpx==0.28.1", "pydantic==2.12.5", "textual==8.2.8"]

[project.optional-dependencies]
evaluation = ["scikit-learn==1.7.2", "numpy==2.2.6"]

[project.scripts]
metis = "autoresearch.cli:main"
autoresearch = "autoresearch.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.2", "mypy==1.18.2", "pre-commit==4.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

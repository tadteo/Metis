name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      AUTORESEARCH_HOME: ${{ runner.temp }}/autoresearch
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned package manager
        run: python -m pip install uv==0.10.3
      - name: Install locked development dependencies
        run: uv sync --frozen --group dev
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Check types
        run: uv run --frozen mypy src
      - name: Test
        run: uv run --frozen pytest
      - name: Scan public files
        run: uv run --frozen python scripts/scan_secrets.py
      - name: Validate secret scanner
        run: uv run --frozen python scripts/scan_secrets.py --self-test
      - name: Offline end-to-end smoke test
        run: uv run --frozen autoresearch demo
